[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aml-swift-investigation"
version = "1.0.0"
description = "Evidence-grounded AML investigation prototype for synthetic cross-border SWIFT payments"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "plotly>=5.18",
    "ipywidgets>=8.0",
    "scikit-learn>=1.3"
]

[tool.setuptools]
package-dir = {"" = "src"}
